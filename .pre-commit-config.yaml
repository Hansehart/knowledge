repos:
  # Whitespace, syntax and size, across every file in the repository.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files

  # Runs the checks at the versions pinned with the project, so tool versions have one source of truth.
  - repo: local
    hooks:
      # The project file, checked against the packaging schemas and those of each tool it configures.
      - id: validate-pyproject
        name: validate-pyproject
        entry: uv run validate-pyproject
        language: system
        files: ^pyproject\.toml$

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false  # mypy checks the whole package and its tests

      - id: uv-lock
        name: uv lock (check)
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false  # the lock file is checked against the project as a whole
