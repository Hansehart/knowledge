repos:
  # Checks for every file and commit, whatever the language.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: no-commit-to-branch
      - id: trailing-whitespace

  # Checks at the versions pinned with the project, so each tool has one source of truth.
  - repo: local
    hooks:
      - id: validate-pyproject
        name: validate-pyproject
        entry: uv run --locked validate-pyproject
        language: unsupported
        files: ^pyproject\.toml$

      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: unsupported
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: unsupported
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: uv run --locked mypy src tests
        language: unsupported
        types: [python]
        pass_filenames: false  # mypy checks the whole package and its tests

      - id: uv-lock
        name: uv lock (check)
        entry: uv lock --check
        language: unsupported
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false  # the lock file is checked against the project as a whole
